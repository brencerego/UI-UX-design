<!DOCTYPE html>
<html>
<head>
    <title>My Feedback Form</title>
</head>
<body>

    <h1 align="center">My Feedback Form</h1>

    <form>

        Name:
        <input type="text">
        <br><br>

        Email:
        <input type="email">
        <br><br>

        Password:
        <input type="password">
        <br><br>

        Please check all the emotions that apply to you:
        <br><br>

        Angry
        <input type="checkbox">
        <br>

        Sad
        <input type="checkbox">
        <br>

        Happy
        <input type="checkbox">
        <br>

        Ambivalent
        <input type="checkbox">
        <br><br>

        How satisfied were you with our service?
        <br><br>

        Very Satisfied
        <input type="radio" name="satisfaction">
        <br>

        Satisfied
        <input type="radio" name="satisfaction">
        <br>

        Didn't care
        <input type="radio" name="satisfaction">
        <br>

        Dissatisfied
        <input type="radio" name="satisfaction">
        <br>

        Very Dissatisfied
        <input type="radio" name="satisfaction">
        <br><br>

        Further comments:
        <textarea style="width: 400px; height: 99px;"></textarea>
        <br><br>

        Bio photo:
        <input type = "file" accept = "jpg,png">
        <br><br>

        Location Visited:
        <select name="location">
            <option value="">Select Location</option>
            <option value="Mangalore">Mangalore</option>
            <option value="Bangalore">Bangalore</option>
            <option value="Mysore">Mysore</option>
            <option value="Chennai">Chennai</option>
        </select>

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
