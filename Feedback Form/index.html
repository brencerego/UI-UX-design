<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My feedback form</h1>
    <form>
        <label>Name:</label>
        <input type = "text">
        <br><br>
        <label>Email:</label>
        <input type = "text">
        <br><br>
        <label>Password:</label>
        <input type = "text">
        <br><br>
        <label>Please check all the emotions that apply to you:</label>
        <br><br>
         <label>Angry</label>
        <input type = "checkbox">
        <br><br>
         <label>Sad</label>
        <input type = "checkbox">
        <br><br>
         <label>Happy</label>
        <input type = "checkbox">
        <br><br>
         <label>Ambivalent</label>
        <input type = "checkbox">
        <br><br>
        <label>How satisfied were you with our service?</label>
        <br><br>
         <label>Very satisfied</label>
        <input type = "radio">
        <br><br>
         <label>Satisfied</label>
        <input type = "radio">
        <br><br>
         <label>Didn't care</label>
        <input type = "radio">
        <br><br>
         <label>Dissatisfied</label>
        <input type = "radio">
        <br><br>
         <label>Very dissatisfied</label>
        <input type = "radio">
        <br><br>
        <label>Further comments:</label>
        <textarea style="width: 400px; height: 99px;"></textarea>
        <br><br
        <label>Bio photo:</label>
        <input type = "text">
        <input type = "file" accept = "jpg,png">
        <br><br
        <label>Location visited:</label>
        <input type = "number" placeholder="Select Location"
        <br><br>
        <br><br>
        <input type="submit" value="submit">
    </form>
    
</body>
</html>
